<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Lending Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="blt-container">

    <header class="blt-header">
      <h1>Book Lending Tracker</h1>
      <p>Manage borrowed library books, track return deadlines, and monitor overdue loans.</p>
    </header>

    <section class="blt-summary-grid">
      <div class="blt-stat-card blt-stat-card--primary">
        <div class="blt-stat-title">Total Loans</div>
        <div id="total-loans" class="blt-stat-value">0</div>
      </div>
      <div class="blt-stat-card blt-stat-card--danger">
        <div class="blt-stat-title">Overdue Loans</div>
        <div id="overdue-loans" class="blt-stat-value">0</div>
      </div>
    </section>

    <section class="blt-card">
      <form id="loan-form" novalidate>
        <div class="blt-form-grid">

          <div class="blt-form-group">
            <label class="blt-label" for="title">Title *</label>
            <input class="blt-input" type="text" id="title" placeholder="e.g. Clean Code">
            <span id="title-error" class="blt-error-message"></span>
          </div>

          <div class="blt-form-group">
            <label class="blt-label" for="author">Author *</label>
            <input class="blt-input" type="text" id="author" placeholder="e.g. Robert C. Martin">
            <span id="author-error" class="blt-error-message"></span>
          </div>

          <div class="blt-form-group">
            <label class="blt-label" for="borrower">Borrower *</label>
            <input class="blt-input" type="text" id="borrower" placeholder="e.g. John Doe">
            <span id="borrower-error" class="blt-error-message"></span>
          </div>

          <div class="blt-form-group">
            <label class="blt-label" for="dueDate">Due Date *</label>
            <input class="blt-input" type="date" id="dueDate">
            <span id="dueDate-error" class="blt-error-message"></span>
          </div>

          <div class="blt-form-group">
            <label class="blt-label" for="genre">Genre *</label>
            <select class="blt-select" id="genre">
              <option value="">Select genre</option>
              <option value="Fiction">Fiction</option>
              <option value="Non-Fiction">Non-Fiction</option>
              <option value="Technology">Technology</option>
              <option value="Science">Science</option>
              <option value="History">History</option>
              <option value="Philosophy">Philosophy</option>
            </select>
            <span id="genre-error" class="blt-error-message"></span>
          </div>

          <div class="blt-form-group">
            <label class="blt-label" for="status">Status</label>
            <select class="blt-select" id="status">
              <option value="Borrowed">Borrowed</option>
              <option value="Returned">Returned</option>
            </select>
          </div>
        </div>

        <button type="submit" class="blt-btn blt-btn--primary">Add Loan Record</button>
      </form>
    </section>

    <section class="blt-card">
      <div class="blt-table-wrapper">
        <table class="blt-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Borrower</th>
              <th>Due Date</th>
              <th>Genre</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="loans-table-body">
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
